name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: kannaka-tui-windows-x86_64.exe
          # Pinned to ubuntu-22.04 (glibc 2.35). 2.39 from ubuntu-latest
          # is too new for Oracle Linux 9, Debian 12, Fedora ≤39, RHEL 9,
          # and stock Ubuntu 22.04 — same reasoning as kannaka-memory.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: kannaka-tui-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: kannaka-tui-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: kannaka-tui-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kannaka-tui-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Signed BEFORE staging, because staging computes the .sha256 sidecar and
      # signing rewrites the file. Signed after, the sidecar would describe the
      # unsigned bytes, and every installer that verifies it would refuse the
      # download — loudly, but only for users, and only after a release.
      #
      # A "Developer ID Application" certificate: the one that signs
      # EXECUTABLES. The .pkg installers use "Developer ID Installer". They are
      # separate certificates from the same account and are not interchangeable.
      - name: Sign macOS binary (Developer ID Application)
        if: contains(matrix.target, 'apple-darwin') && env.HAS_APP_SIGN == 'true'
        shell: bash
        env:
          HAS_APP_SIGN: ${{ secrets.MACOS_APP_CERT_P12_BASE64 != '' }}
          CERT_B64: ${{ secrets.MACOS_APP_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
        run: |
          trap 'rm -f appcert.p12' EXIT
          echo "$CERT_B64" | base64 -d > appcert.p12
          security create-keychain -p actions app.keychain
          security default-keychain -s app.keychain
          security unlock-keychain -p actions app.keychain
          security import appcert.p12 -k app.keychain -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions app.keychain
          ID=$(security find-identity -v app.keychain | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$ID" ]; then
            echo "::error::no 'Developer ID Application' identity — an Installer certificate cannot sign an executable"
            security find-identity -v app.keychain || true
            exit 1
          fi
          echo "signing as: $ID"
          # Hardened runtime is required by notarisation; the timestamp keeps
          # the signature valid past the certificate's own expiry.
          BIN="target/${{ matrix.target }}/release/kannaka-tui"
          codesign --force --sign "$ID" --timestamp --options runtime "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Stage binary + SHA-256 sidecar
        # kannaka v0.6.2+ verifies the .sha256 sidecar before atomic
        # rename in self_update — same pattern as kannaka-memory's
        # release.yml. ADR-0029 Phase 4a.
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/kannaka-tui.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/kannaka-tui ${{ matrix.artifact }}
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      # Notarised AFTER checksumming, which is safe here and would NOT be for a
      # .pkg: a bare Mach-O binary cannot be stapled. `stapler` attaches a
      # ticket to .app, .dmg and .pkg only, so for a loose executable
      # notarisation is a record Apple keeps and Gatekeeper checks ONLINE.
      # Nothing is written back into the file, so the sidecar stays true.
      #
      # What it buys, precisely: a binary downloaded in a BROWSER carries
      # com.apple.quarantine and Gatekeeper refuses it outright today. Notarised,
      # that same download is checked against Apple and opens. A machine with no
      # network still refuses it — inherent to an unstapleable format rather than
      # something this step gets wrong. (The installer path was never affected:
      # curl sets no quarantine flag.)
      - name: Notarise macOS binary
        if: contains(matrix.target, 'apple-darwin') && env.HAS_APP_SIGN == 'true'
        shell: bash
        env:
          HAS_APP_SIGN: ${{ secrets.MACOS_APP_CERT_P12_BASE64 != '' }}
          AC_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          AC_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          AC_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          # Trimmed and case-corrected for the reason the plugin repo learned:
          # Apple compares the team id case-sensitively and answers a lower-case
          # one with "Invalid or inaccessible developer team ID", which reads as
          # a permissions problem and sends people to check their membership.
          ID_EMAIL=$(printf '%s' "$AC_APPLE_ID" | tr -d '\r\n' | sed 's/^ *//; s/ *$//')
          TEAM=$(printf '%s' "$AC_TEAM_ID" | tr -d '\r\n' | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]//g')
          PW=$(printf '%s' "$AC_PASSWORD" | tr -d '\r\n' | sed 's/^ *//; s/ *$//')
          if ! printf '%s' "$PW" | grep -Eq '^[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}$'; then
            echo "::error::MACOS_NOTARY_PASSWORD is not shaped like an app-specific password (expected abcd-efgh-ijkl-mnop)"
            exit 1
          fi

          ditto -c -k --keepParent "${{ matrix.artifact }}" tui.zip
          xcrun notarytool submit tui.zip --apple-id "$ID_EMAIL" --team-id "$TEAM" --password "$PW" --wait --output-format json > n.json
          cat n.json
          st=$(python3 -c 'import json;print(json.load(open("n.json")).get("status",""))')
          if [ "$st" != "Accepted" ]; then
            echo "::error::notarisation returned '$st', not Accepted"
            # The log is the only place that says WHY — a hardened-runtime or
            # signature problem is named there and nowhere else.
            nid=$(python3 -c 'import json;print(json.load(open("n.json")).get("id",""))')
            [ -n "$nid" ] && xcrun notarytool log "$nid" --apple-id "$ID_EMAIL" --team-id "$TEAM" --password "$PW" || true
            exit 1
          fi
          rm -f tui.zip n.json

          # The sidecar must still describe what ships. A check rather than a
          # fix — but if notarisation ever did rewrite the file, the failure
          # would otherwise surface as a checksum mismatch in every installer.
          shasum -a 256 -c "${{ matrix.artifact }}.sha256" || { echo "::error::binary changed after checksumming"; exit 1; }
          echo "::notice::notarised ${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload SHA-256 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}.sha256
          path: ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
